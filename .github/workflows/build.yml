name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get > out.txt 2>&1 || { tail -30 out.txt | sed 's/^/::error::/'; exit 1; }
      # Failures are echoed as annotations so they can be read via the API.
      - name: Analyze
        run: flutter analyze --no-fatal-infos > out.txt 2>&1 || { grep -E "error|warning" out.txt | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Test
        env:
          PREVIEW_OUT: /tmp/preview
        run: |
          mkdir -p test/fonts && curl -sSL -o test/fonts/Readex.ttf "https://github.com/google/fonts/raw/main/ofl/readexpro/ReadexPro%5BHEXP%2Cwght%5D.ttf" || true
          flutter test > out.txt 2>&1 || { tail -40 out.txt | sed 's/^/::error::/'; exit 1; }

      - name: Push UI previews
        run: |
          [ -d /tmp/preview ] || exit 0
          SHA=${{ github.sha }}
          cd /tmp/preview && git init -q && git checkout -q -b previews
          echo $SHA > commit.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -qm "previews for $SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release > out.txt 2>&1 || { grep -iE "error|exception|failed" out.txt | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Report signing certificate
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          echo "::notice::$($AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-1')"

      - uses: actions/upload-artifact@v4
        with:
          name: jeddah-run-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Publish the APK as a release so it downloads directly on a phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk jeddah-run.apk
          gh release create "build-${{ github.run_number }}" jeddah-run.apk \
            --title "نسخة ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" --latest

  # Runs the built APK on an Android emulator and pushes screenshots/logs to the "diag" branch.
  diagnose:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jeddah-run-apk
      - run: mv app-release.apk jeddah-run.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/diagnose.sh
      - name: Push diagnostics
        run: |
          mv diag /tmp/diag
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan diag
          git rm -rfq . ; cp -r /tmp/diag ./diag
          echo "${{ github.sha }}" > diag/commit.txt
          git add diag && git commit -qm "diagnostics for ${{ github.sha }}"
          git push -f origin diag
