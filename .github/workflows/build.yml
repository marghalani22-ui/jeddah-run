name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org sa.jeddahrun --project-name jeddah_run .
          rm -f test/widget_test.dart

      - name: Set app name and permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="jeddah_run"/android:label="جري جدة"/' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jeddah-run-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
