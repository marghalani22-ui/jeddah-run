<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>جري جدة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: runner-first app shell — slim HUD, pannable whole-Jeddah game map as home with a floating run dock, 5 tabs. Look: clean sport app (white surfaces, hairlines, soft elevation) around an illustrated map; the map and the gold "pace coin" carry the game feel. Single light look by choice. */
:root{
  --sand:#F4F2ED; --sand2:#ECE7DD; --land:#EFE6D4; --card:#FFFFFF;
  --ink:#14213D; --edge:#E3DCCF; --muted:#5E6679; --line:#EEE9DF;
  --sea:#12A4B8; --sea-deep:#0B6E8A; --coral:#F25C2C; --sun:#FFB81C; --sun-soft:#FFF3D6;
  --leaf:#2FB36C; --grape:#5B3FD9; --grape-soft:#EEEAFF;
  --good:#1F7A4A; --good-soft:#E3F5EA; --bad:#C2410C; --bad-soft:#FFE7DD;
  --snap-me:#E8453C; --snap-them:#1E88D9;
  --z1:#9AA6B8; --z2:#3CBCD4; --z3:#2FB36C; --z4:#FFB020; --z5:#E8453C;
  --navy:#14213D; --navy2:#1E2D4F; --navy-mute:#A9B3C7;
  --sh1:0 1px 2px rgba(20,33,61,.06),0 1px 1px rgba(20,33,61,.04);
  --sh2:0 8px 24px rgba(20,33,61,.14),0 2px 6px rgba(20,33,61,.08);
  --display:'Readex Pro',Tahoma,'Segoe UI',sans-serif;
  --body:'Readex Pro',Tahoma,'Segoe UI',sans-serif;
  color-scheme:light; --goldink:#6B4A00; --glass:rgba(255,255,255,.88); --sunline:#F6DFA4; --grape-ink:#4B2FC9;
}
html,body{height:100%}
body{margin:0;background:#0B3B4F;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sea);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--sand);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){.app{box-shadow:0 20px 60px rgba(0,0,0,.35)}}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:700;letter-spacing:-.01em}

/* HUD */
.hud{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.ava{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:50%;background:linear-gradient(160deg,#3CC3D6,#0E8FA6);border:0;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--sea)}
.ava svg{width:36px;height:36px;margin-top:4px}
.lvl{position:absolute;bottom:-5px;left:-6px;background:#14213D;color:#fff;border:2px solid var(--card);border-radius:9px;padding:0 5px;font-size:10.5px;font-weight:700;line-height:15px}
.hud-mid{flex:1;min-width:0;background:none;border:0;padding:0;text-align:inherit}
.hud-name{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:4px;background:var(--sand2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:4px}
.pts{display:flex;align-items:center;gap:6px;background:var(--sun-soft);border:0;border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-size:15px;color:var(--goldink)}
.coin{width:22px;height:22px;flex-shrink:0}

/* common */
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:18px 16px 28px;display:flex;flex-direction:column;gap:16px}
.h1{font-family:var(--display);font-size:24px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.h2{font-weight:700;font-size:15px;margin:0}
.sub{font-size:12.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--sh1)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:var(--card);font-weight:600;font-size:13.5px;transition:transform .1s,background .15s;box-shadow:var(--sh1)}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun);border-color:transparent;color:#3D2A00}
.btn.coral{background:var(--coral);border-color:transparent;color:#fff}
.btn.main{min-height:50px;border-radius:14px;font-weight:700;font-size:16.5px}
.btn[disabled]{background:var(--sand2);color:var(--muted);border-color:transparent;box-shadow:none;cursor:not-allowed}
.tabs{display:flex;gap:2px;background:var(--sand2);border-radius:12px;padding:3px}
.tabs button{flex:1;min-height:34px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;padding:0 6px;transition:background .15s,color .15s}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.12)}
.row{display:flex;align-items:center;gap:10px}
.list>*{border-bottom:1px solid var(--line)} .list>*:last-child{border-bottom:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:inherit}
button.li:active{background:var(--sand)}
.dot{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.badge-n{min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;border:2px solid var(--card);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.vip{display:inline-block;background:var(--grape-soft);color:var(--grape-ink);border-radius:7px;padding:0 6px;font-size:11px;font-weight:700}
.back{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;color:var(--ink)}
.kpi b{display:block;font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.kpi small{font-size:11.5px;font-weight:500;color:var(--muted)}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* nav */
.nav{flex-shrink:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#5E6679;font-size:11.5px;font-weight:600;min-width:52px;padding:2px 0;position:relative}
.nav .ic{width:44px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:background .15s}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:#E3F4F6;color:var(--sea-deep)}
.nav .world{margin-top:-24px}
.nav .world .ic{width:54px;height:54px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--card),var(--sh2)}
.nav .world[aria-current="page"] .ic{background:linear-gradient(160deg,#18B6C9,#0B6E8A);color:#fff}
.nav .notif{position:absolute;top:0;left:8px}

/* map */
.world{position:absolute;inset:0;background:var(--land);overflow:hidden}
svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
svg.pan{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.pan.grabbing{cursor:grabbing}
.pin{cursor:pointer}
.pi{transform:scale(var(--k,1));transition:transform .15s}
.pin .pi{transform:scale(calc(var(--k,1) * .82))}
.pin.sel .pi{transform:scale(calc(var(--k,1) * 1.1))}
.pin:focus{outline:none} .pin:focus-visible .pi circle{stroke:var(--sea);stroke-width:4}
.dl{font-size:calc(var(--k,1) * 13px);font-weight:600;fill:#3B4458;paint-order:stroke;stroke:#F6F0E3;stroke-width:calc(var(--k,1) * 4px);stroke-linejoin:round;pointer-events:none;letter-spacing:.01em}
.dl.fog{fill:#8A93A6;font-weight:500;stroke:#E8ECF1}
.rl{font-size:calc(var(--k,1) * 9.5px);font-weight:500;fill:#9A7E4C;paint-order:stroke;stroke:#FFFDF8;stroke-width:calc(var(--k,1) * 3px);stroke-linejoin:round;pointer-events:none}
.ll{font-size:calc(var(--k,1) * 10.5px);font-weight:600;fill:#0B5468;paint-order:stroke;stroke:#fff;stroke-width:calc(var(--k,1) * 3.5px);stroke-linejoin:round;pointer-events:none}
.zl{display:none;font-size:calc(var(--k,1) * 19px);font-weight:700;fill:#14213D;opacity:.62;paint-order:stroke;stroke:#F6F0E3;stroke-width:calc(var(--k,1) * 5px);pointer-events:none}
.sea-l{font-size:calc(var(--k,1) * 14px);font-weight:600;fill:#fff;opacity:.75;pointer-events:none}
svg.far .lod-mid{display:none}
svg.far .dl{font-size:calc(var(--k,1) * 11px)}
svg.xfar .dl, svg.xfar .lod-far{display:none}
svg.xfar .zl{display:block}
.me-pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.wtop{position:absolute;top:10px;right:12px;left:12px;z-index:2;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);box-shadow:var(--sh1)}
.wtop .chip{pointer-events:auto;border:0;padding:4px 11px;font-weight:600}
.zoom{position:absolute;left:12px;top:50px;z-index:3;display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
.zoom button{width:44px;height:44px;background:transparent;border:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;font-size:20px;font-weight:500;line-height:1;color:var(--ink)}
.zoom button:last-child{border-bottom:0}
.dock{position:absolute;bottom:14px;right:12px;left:12px;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:22px;box-shadow:var(--sh2)}
.dock .ring{width:46px;height:46px;flex-shrink:0;position:relative}
.dock .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.go{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:16px;border:0;background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(242,92,44,.35);font-weight:700;font-size:17px;white-space:nowrap}
.go:active{transform:scale(.97)}
.info{position:absolute;bottom:92px;right:12px;left:12px;z-index:3;padding:12px 14px;border-radius:20px;animation:enter .18s ease-out;box-shadow:var(--sh2)}
.info .dot{width:40px;height:40px;font-size:14px}
.sheet-back{position:absolute;inset:0;background:rgba(20,33,61,.35);z-index:20;display:flex;align-items:flex-end;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--sand);border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}}
.grab{width:40px;height:5px;border-radius:3px;background:#C9C3B6;align-self:center}

/* run (dark performance panel) */
.run{display:flex;flex-direction:column;height:100%;background:var(--land)}
.run-map{position:relative;flex:1;min-height:180px;overflow:hidden}
.ghostbar{position:absolute;top:10px;right:12px;left:12px;display:flex;align-items:center;gap:10px;padding:8px 14px;z-index:2;transition:background .3s;border-radius:16px}
.panel{flex-shrink:0;background:var(--navy);color:#fff;border-radius:24px 24px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;margin-top:-20px;position:relative;z-index:2;box-shadow:0 -8px 24px rgba(20,33,61,.18)}
.panel .sub,.panel small{color:var(--navy-mute)!important}
.panel .lab{color:#fff}
.panel .tabs{background:var(--navy2)}
.panel .tabs button{color:var(--navy-mute)}
.panel .tabs button[aria-pressed="true"]{background:#fff;color:#14213D}
.panel .chip{background:var(--navy2);border-color:transparent;color:#fff}
.panel .chip.on{background:var(--sun);color:#3D2A00}
.panel .sq{background:var(--navy2);color:#fff;border:0}
.panel .bar{background:var(--navy2)}
.panel #r-hr{color:#FF8A5B!important} .panel #r-pts{color:#5DD39E!important}
.big3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;align-items:end}
.big3 .v{font-weight:700;line-height:.95;letter-spacing:-.02em}
.big3 small{display:block;font-size:11.5px;font-weight:500;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--card);border-radius:12px;padding:6px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.panel .stat{background:var(--navy2);box-shadow:none}
.stat small{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.stat b{font-size:17px;font-weight:700}
.zones{display:flex;gap:3px;margin-top:4px}
.zones i{flex:1;height:4px;border-radius:2px;opacity:.25}
.zones i.on{opacity:1}
.sq{width:48px;height:48px;border-radius:14px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;background:var(--card);font-weight:700;font-size:12.5px}
.count{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,33,61,.82)}
.count b{font-weight:700;font-size:120px;color:#fff;animation:boom .6s ease-out}
@keyframes boom{0%{transform:scale(1.5);opacity:0}40%{transform:scale(1);opacity:1}}
.warn{display:flex;align-items:center;gap:8px;background:rgba(255,138,91,.14);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;color:#FFB49A}
.thumb{width:54px;height:54px;flex-shrink:0;border-radius:12px;background:var(--sand2)}

/* chat (snap style) */
.search{display:flex;align-items:center;gap:8px;height:42px;background:var(--sand2);border-radius:21px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;font-weight:500;min-width:0;color:var(--ink)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;background:none;border:0;text-align:inherit}
.crow:active{background:var(--sand2)}
.cava{position:relative;width:50px;height:50px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff}
.cava.run{box-shadow:0 0 0 2.5px var(--sand),0 0 0 4.5px var(--leaf)}
.cname{font-size:15px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname.new{font-weight:700}
.cstat{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden}
.cstat.new{color:var(--snap-them);font-weight:700}
.streak{display:flex;align-items:center;gap:2px;font-weight:700;font-size:13px;flex-shrink:0}
.msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.mg{display:flex;flex-direction:column;gap:3px}
.mg b{font-size:11.5px;font-weight:700}
.mg p{margin:0;padding:1px 10px 1px 0;border-right:2.5px solid;font-size:15px;line-height:1.55}
.mg.me b{color:var(--snap-me)} .mg.me p{border-color:var(--snap-me)}
.mg.them b{color:var(--snap-them)} .mg.them p{border-color:var(--snap-them)}
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.composer input{flex:1;height:44px;border-radius:22px;border:0;background:var(--sand2);padding:0 16px;font-size:15px;font-weight:500;min-width:0}
.sendb{width:44px;height:44px;border-radius:50%;border:0;background:var(--snap-them);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* profile */
.banner{position:relative;background:linear-gradient(160deg,#18B6C9,#0B6E8A);padding:14px 16px 70px;overflow:hidden}
.banner svg.bg{position:absolute;inset:0;width:100%;height:100%}
.pfava{width:104px;height:104px;border-radius:50%;background:linear-gradient(160deg,#FFE7B8,#FFD08A);border:4px solid #fff;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:var(--sh2)}
.pfava svg{width:96px;height:96px}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;background:none;border:0;text-align:inherit;font-size:14.5px;font-weight:500}

.stage{position:relative;background:#0B5E78;padding:14px 16px 34px;overflow:hidden}
.stage::after{content:'';position:absolute;z-index:0;left:50%;bottom:26px;width:220px;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.35),rgba(255,255,255,0))}
.stage-art{position:relative;z-index:1;display:flex;justify-content:center;padding-top:4px}
.stage-art svg{filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;border-radius:14px;border:1px solid var(--edge);background:var(--card);font-size:12px;font-weight:600;color:var(--muted)}
.opt-art{width:58px;height:58px;border-radius:50%;background:linear-gradient(160deg,#E3F4F6,#CDEBEF);overflow:hidden;display:flex}
.opt-art svg{width:100%;height:100%}
.opt[aria-pressed="true"]{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea);color:var(--ink)}
/* intro */
.intro{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(170deg,#18B6C9 0%,#0B6E8A 100%);overflow:hidden}
.intro .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px}
.intro .art > svg{width:min(320px,90%);height:auto;max-height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18))}
.intro .txt{background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--edge);transition:width .2s}
.dots i.on{width:22px;background:var(--coral)}
.skip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:5px 14px;font-weight:600;font-size:13px}
.brand{position:absolute;top:14px;right:16px;z-index:2;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:6px}
.fogclear{animation:fogc 3s ease-in-out infinite}
@keyframes fogc{0%,20%{opacity:1}60%,100%{opacity:0}}
.float{animation:float 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes float{50%{transform:translateY(-6px)}}
.runx{animation:runx 3.2s linear infinite}
@keyframes runx{from{transform:translateX(-30px)}to{transform:translateX(30px)}}

/* misc */
.toast{position:absolute;top:104px;left:50%;transform:translate(-50%,-8px);z-index:40;background:#14213D;color:#fff;border-radius:14px;padding:8px 16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;box-shadow:var(--sh2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{font-weight:700;font-size:15px;display:block;line-height:1.3}
.toast span{font-size:12px;font-weight:500;color:var(--sun)}
.modal-back{position:absolute;inset:0;z-index:35;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{width:100%;max-width:340px;background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;box-shadow:var(--sh2)}

/* badges */

/* profile v12 */

/* store card offer */

/* ---------- night & dusk ---------- */
.app[data-ui="dark"],.app[data-ui="dusk"]{--sand:#0E1525;--sand2:#1A2440;--land:#141D33;--card:#17213A;--ink:#EEF2FA;--edge:#26314E;--muted:#A3AEC6;--line:#202A45;--sun-soft:#33280F;--sunline:#5A4718;--goldink:#FFD27A;--good:#4ADE8B;--good-soft:#123425;--bad:#FF9A6B;--bad-soft:#3A1E16;--grape-soft:#2A2350;--grape-ink:#C3B5FF;--sh1:0 1px 2px rgba(0,0,0,.45);--sh2:0 10px 28px rgba(0,0,0,.55);--glass:rgba(23,33,58,.86);color-scheme:dark}

.skybg{position:absolute;inset:0;z-index:0;pointer-events:none}

const zoneOf = hr => hr < 120 ? 1 : hr < 140 ? 2 : hr < 155 ? 3 : hr < 170 ? 4 : 5;
function walkPath(seed, km, start, heading){
  const R = rng(seed), p = {x:start.x, y:start.y}, path = [{...p}];
  const steps = Math.round(km * 1000 / M_PER_UNIT / 3);
  for (let i = 0; i < steps; i++){
    heading = Math.atan2(Math.sin(heading), Math.cos(heading)) + (R() - .5) * .35;
    if (p.x < cornX(p.y) + 30) heading *= .7;
    if (p.x > 1250) heading += .3;
    p.x = Math.max(cornX(p.y) + 4, p.x + Math.cos(heading) * 3); p.y = clamp(p.y + Math.sin(heading) * 3, 20, 2780);
    path.push({...p});
  }
  return path;
}
function genRun(o){
  const R = rng(o.seed + 7), splits = [];
  for (let k = 0; k < Math.floor(o.km); k++){ const hr = Math.round(140 + 14 * k / o.km + R() * 8); splits.push({t:Math.round(o.pace + (R() - .5) * 24 - (k === Math.floor(o.km) - 1 ? 10 : 0)), hr, z:zoneOf(hr)}); }
  const t = Math.round(o.pace * o.km);
  return {id:'r' + o.seed, name:o.name, when:o.when, km:o.km, t, path:o.path || walkPath(o.seed, o.km, o.start, o.heading || -1), splits,
    hr:Math.round(splits.reduce((a, s) => a + s.hr, 0) / Math.max(1, splits.length)), cad:Math.round(166 + R() * 8), elev:Math.round(o.km * 2 + R() * 6), kcal:o.km * 72,

}

function mapSVG(mode, path){
  const pc = id => `pin${S.sel === id ? ' sel' : ''}`;
  const pin = (id, label, x, y, kind, lod = '') => `<g class="${pc(id)} ${lod}" data-act="pin" data-id="${id}" role="button" tabindex="0" aria-label="${label}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="pi">${pinSVG(kind)}</g></g>`;

  let s = `<svg class="map${mode ? '' : ' pan'}" viewBox="0 0 390 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="خريطة جدة">` + baseMap() + fogFix() + streetsSVG() ;
  if (mode === 'route'){
    const a = path[0], b = path[path.length-1];
    return s + labelsSVG() + `<polyline points="${path.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#F25C2C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
     <g transform="translate(${a.x} ${a.y})"><g class="pi"><circle r="7" fill="#4CB963" stroke="#1D2433" stroke-width="2"/></g></g><g transform="translate(${b.x} ${b.y})"><g class="pi"><circle r="7" fill="#1D2433" stroke="#fff" stroke-width="2"/></g></g></svg>`;
  }
  if (mode === 'run'){
    s += labelsSVG() + `<polyline id="ftrail2" points="${ME.x},${ME.y}" fill="none" stroke="#fff" style="stroke-width:calc(var(--k,1) * 10px)" stroke-linecap="round" stroke-linejoin="round"/><polyline id="ftrail" points="${ME.x},${ME.y}" fill="none" stroke="#F25C2C" style="stroke-width:calc(var(--k,1) * 6px)" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="ghost"><g class="pi"><circle r="15" fill="#5B3FD9" opacity=".18"/><path d="M-8 10V-1a8 8 0 0 1 16 0v11l-2.7-2.2-2.6 2.2-2.7-2.2-2.7 2.2-2.6-2.2z" fill="#fff" stroke="#5B3FD9" stroke-width="2" stroke-linejoin="round"/><circle cx="-3" cy="-1" r="1.6" fill="#5B3FD9"/><circle cx="3" cy="-1" r="1.6" fill="#5B3FD9"/></g></g>
    <g id="runner"><g class="pi"><circle r="24" fill="#1E88D9" opacity=".22" class="me-pulse"/><circle r="11" fill="#1E88D9" stroke="#fff" stroke-width="4"/></g></g>`;
    return s + '</svg>';
  }
  for (const g of SEGMENTS) s += `<path d="${g.path}" fill="none" stroke="#5B3FD9" stroke-opacity="${S.sel===g.id ? .95 : .7}" stroke-width="${S.sel===g.id ? 8 : 5}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${S.sel===g.id ? 'none' : '1 10'}"/>`;
  if (S.heat) s += `<image href="${heatURL()}" x="${HM.x0}" y="${HM.y0}" width="${HM.w}" height="${HM.h}" preserveAspectRatio="none" class="hm"/>`;
  s += S.runs.map(r => `<polyline class="heat" points="${r.path.map(q => q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ')}"/>`).join('');
  s += labelsSVG();
  for (const id of CHESTS){ const d = district(id); if (d && !d.ex) s += pin('chest-' + id, 'صندوق غنائم ' + d.name, d.cx, d.cy + 62, 'chest', 'lod-mid'); }
  for (const st of STORES) s += pin(st.id, st.name, st.x, st.y, 'store', 'lod-mid');
  for (const e of EVENTS) s += pin(e.id, e.name, e.x, e.y, 'event', 'lod-far');
  for (const g of SEGMENTS) s += pin(g.id, g.name, g.x, g.y, 'seg', 'lod-far');
  for (const p of PLAYERS) s += `<g class="${pc(p.id)} player lod-mid" data-act="pin" data-id="${p.id}" role="button" tabindex="0" aria-label="${p.name}"><g class="pi"><ellipse cx="0" cy="16" rx="9" ry="2.6" fill="#14213D" opacity=".22"/><circle r="15" fill="${p.c}" stroke="#fff" stroke-width="3"/>${bustIn(friendProfile(p.id, p.c), 26).replace('<svg ', '<svg x="-13" y="-15" ')}</g></g>`;

function setK(svg){
  if (!svg) return;
  const vb = svg.viewBox.baseVal, cw = svg.clientWidth || 390, ch = svg.clientHeight || 700;
  const k = Math.min(vb.width / cw, vb.height / ch);
  svg.style.setProperty('--k', k.toFixed(3));
  svg.style.setProperty('--mek', k > 3 ? '.85' : '1');
  svg.classList.toggle('far', k > 2.1);
  svg.classList.toggle('near', k < 1.45);
  svg.classList.toggle('xfar', k > 3.3);
}
function fitView(svg, path, padding = 40){
  const xs = path.map(p => p.x), ys = path.map(p => p.y);
  const x0 = Math.min(...xs) - padding, x1 = Math.max(...xs) + padding, y0 = Math.min(...ys) - padding, y1 = Math.max(...ys) + padding;
  const cw = svg.clientWidth || 358, ch = svg.clientHeight || 190, asp = ch / cw;
  const w = Math.max(x1 - x0, (y1 - y0) / asp, 120), h = w * asp;
  svg.setAttribute('viewBox', `${((x0 + x1) / 2 - w / 2).toFixed(1)} ${((y0 + y1) / 2 - h / 2).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  setK(svg);
}

function paceChart(r){
  if (r.splits.length < 2) return '';
  const S2 = r.splits.map(s => s.t), n = S2.length, W = 320, H = 120, pl = 30, pr = 8, pt = 10, pb = 22;
  const gp = GHOST_BASE, lo = Math.min(...S2, gp) - 8, hi = Math.max(...S2, gp) + 8;
  const X = i => pl + (W - pl - pr) * (n === 1 ? .5 : i / (n - 1)), Y = v => pt + (H - pt - pb) * (v - lo) / (hi - lo);
  const line = S2.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `M${X(0)} ${H - pb}L${line.replace(/ /g, 'L')}L${X(n - 1)} ${H - pb}Z`;
  const best = S2.indexOf(Math.min(...S2));
  return `<div class="card" style="padding:10px 12px"><div class="row" style="justify-content:space-between"><b style="font-size:14px">السرعة لكل كيلو</b><span class="sub"><span style="color:var(--coral);font-weight:700">━</span> أنت · <span style="color:var(--grape-ink);font-weight:700">┅</span> ظلك ${pace(gp)}</span></div>
   <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px" role="img" aria-label="السرعة لكل كيلو مقارنة بالظل">
    <defs><linearGradient id="pcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F25C2C" stop-opacity=".35"/><stop offset="1" stop-color="#F25C2C" stop-opacity="0"/></linearGradient></defs>
    ${[lo + 8, (lo + hi) / 2, hi - 8].map(v => `<text x="2" y="${Y(v) + 3}" font-size="9" style="fill:var(--muted)">${pace(v)}</text><line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/>`).join('')}
    <path d="${area}" fill="url(#pcg)"/><polyline points="${line}" fill="none" stroke="#F25C2C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${pl}" x2="${W - pr}" y1="${Y(gp)}" y2="${Y(gp)}" stroke="#7B5CFF" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="${X(best)}" cy="${Y(S2[best])}" r="4.5" fill="#F25C2C" stroke="#fff" stroke-width="2"/>
    ${S2.map((_, i) => i % Math.ceil(n / 8) === 0 || i === n - 1 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="9.5" style="fill:var(--muted)">${i + 1}</text>` : '').join('')}
   </svg><div class="sub" style="text-align:center;margin-top:-2px">الأعلى أسرع · أسرع كيلو: ${best + 1} (${pace(S2[best])})</div></div>`;

function storeCards(){

  return list.map(s => `<button class="card" style="padding:0;overflow:hidden;text-align:inherit" data-act="openStore" data-id="${s.id}">

let simTimer = null;
function startRun(){
  S.run = {t:0, dist:0, ghostDist:0, paused:false, splits:[], lastKmT:0, kmDone:0, kmHr:0, kmHrN:0, pts:0, hrSum:0, ghost:S.ghostPref!=='off', ghostPace:ghostPaceFor(S.ghostPref), lead:null,
    pos:{x:ME.x, y:ME.y}, heading:-1.1, path:[{x:ME.x, y:ME.y}], cum:[0], zones:[], weak:false, acc:4, laps:[0], marks:{}};

function districtAt(p){ return D.find(d => inPoly(p.x, p.y, d.pts)); }
function runLoop(){ clearInterval(simTimer); simTimer = setInterval(tick, 1000 / S.speed); }
function tick(){
  const r = S.run; if (!r || r.paused) return;
  r.t += 1;
  const myPace = 350 + 16 * Math.sin(r.t / 80) + (Math.random() * 10 - 5); r.curPace = myPace;
  const step = 1000 / myPace;
  r.dist += step; r.ghostDist = r.t * 1000 / r.ghostPace;
  const cyc = r.t % 420; r.weak = cyc >= 200 && cyc < 228; r.acc = r.weak ? 0 : Math.round(3 + Math.random() * 3);
  const p = r.pos;
  r.heading = Math.atan2(Math.sin(r.heading), Math.cos(r.heading)) + (Math.random() - .5) * .22;
  if (p.x < cornX(p.y) + 30) r.heading *= .7;
  if (p.x > 1250) r.heading += .3;
  if (p.y < 30) r.heading += (Math.PI/2 - r.heading) * .2;
  if (p.y > 2770) r.heading += (-Math.PI/2 - r.heading) * .2;
  const u = step / M_PER_UNIT;
  p.x = Math.max(cornX(p.y) + 4, p.x + Math.cos(r.heading) * u); p.y += Math.sin(r.heading) * u;
  r.path.push({x:p.x, y:p.y}); r.cum.push(r.dist);
  r.hr = Math.round(132 + 22 * Math.min(r.t / 700, 1) + 6 * Math.sin(r.t / 60) + Math.random() * 4); r.hrSum += r.hr; r.kmHr += r.hr; r.kmHrN++;
  for (const k of ['1','5','10','21']) if (!r.marks[k] && r.dist >= (k === '21' ? 21097 : +k * 1000)) r.marks[k] = r.t;
  const km = Math.floor(r.dist / 1000);
  if (km > r.kmDone){ const hr = Math.round(r.kmHr / r.kmHrN); r.splits.push({t:r.t - r.lastKmT, hr, z:zoneOf(hr)}); r.lastKmT = r.t; r.kmDone = km; r.kmHr = 0; r.kmHrN = 0; const add = 10 * (S.sub ? 2 : 1); r.pts += add; toast(`كيلو ${km} · ${pace(r.splits[r.splits.length-1].t)}`, `+${add}`); }
  if (r.ghost){ const lead = r.dist >= r.ghostDist; if (r.lead !== null && lead !== r.lead && r.t > 20) toast(lead ? 'تجاوزت ظلك' : 'الظل سبقك', ''); r.lead = lead; }
  const gk = goalKm(); if (gk && !r.goalHit && r.dist >= gk * 1000){ r.goalHit = true; toast('وصلت هدفك', gk + ' كم'); }
  const d = districtAt(p);
  if (d && !d.ex){ d.ex = true; r.zones.push(d.name); const c = 50 * (S.sub ? 2 : 1); r.pts += c; toast('انكشف حي ' + d.name, `+${c}`);
    const fg = document.querySelector(`.run-map .fog[data-d="${d.id}"]`); if (fg) fg.remove(); }
  updateRunUI();
}
function updateRunUI(){
  const r = S.run; if (!r) return;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('r-dist', (r.dist/1000).toFixed(2)); set('r-time', mmss(r.t)); set('r-pace', pace(r.curPace)); set('r-avg', r.dist > 50 ? pace(r.t / (r.dist/1000)) : '–');
  set('r-hr', r.hr || '–'); set('r-kcal', fmt(r.dist/1000*72)); set('r-cad', r.t ? 170 : '–'); set('r-elev', Math.round(r.dist/500) + ' م'); set('r-pts', '+' + fmt(r.pts));
  const zs = document.querySelectorAll('#r-zones i'); if (r.hr) zs.forEach((z, i) => z.classList.toggle('on', i + 1 === zoneOf(r.hr)));
  const gk = goalKm(); if (gk){ const gi = document.getElementById('r-goal'); if (gi) gi.style.width = clamp(r.dist / (gk*10), 0, 100) + '%'; set('r-goalt', `${(r.dist/1000).toFixed(2)} / ${gk} كم`); }
  const g = document.getElementById('r-gps');
  if (g){ g.textContent = r.weak ? 'إشارة ضعيفة · نحسب بالخطوات' : `GPS ±${r.acc} م`; g.style.background = r.weak ? 'var(--bad-soft)' : 'var(--glass)'; }
  const gh = document.getElementById('ghost'); if (!gh) return;

  let gp = null; if (r.ghostDist <= r.dist){ let lo = 0, hi = r.cum.length - 1; while (lo < hi){ const m = (lo + hi) >> 1; if (r.cum[m] < r.ghostDist) lo = m + 1; else hi = m; } gp = r.path[lo]; }
  document.getElementById('runner').setAttribute('transform', `translate(${p.x} ${p.y})`);
  gh.style.display = r.ghost && gp ? '' : 'none'; if (gp) gh.setAttribute('transform', `translate(${gp.x} ${gp.y})`);
  const rs = document.querySelector('.run-map svg'); rs.setAttribute('viewBox', `${p.x - 260} ${p.y - 300} 520 520`); setK(rs);

    const dm = r.dist - r.ghostDist, sec = dm / (1000 / r.curPace);
    set('gaptxt', Math.abs(dm) < 3 ? 'متساويان' : `${dm > 0 ? 'متقدم' : 'متأخر'} ${Math.abs(Math.round(sec))} ث`);
    const gc = document.getElementById('gapcard'); if (gc) gc.style.background = Math.abs(dm) < 3 ? 'var(--card)' : dm > 0 ? 'var(--good-soft)' : 'var(--bad-soft)';

}
function finishRun(){
  clearInterval(simTimer);
  const r = S.run; if (!r) return;
  const km = Math.max(r.dist / 1000, 0.01), ghostWin = r.ghost ? r.dist >= r.ghostDist : null, ghostGap = r.ghost ? Math.round((r.dist - r.ghostDist) / (1000 / (r.curPace || 360))) : null;
  if (ghostWin) r.pts += 40 * (S.sub ? 2 : 1);
  const newPRs = [];
  for (const k of Object.keys(r.marks)) if (!S.prs[k] || r.marks[k] < S.prs[k]){ S.prs[k] = r.marks[k]; newPRs.push(k); }
  if (newPRs.length) r.pts += 60 * newPRs.length;
  const path = r.path.length > 1 ? r.path : [{x:ME.x, y:ME.y}, {x:ME.x + 1, y:ME.y}];
  const run = {id:'r' + Date.now(), name:S.label || 'جري حر', when:'الآن', km, t:r.t, path, splits:r.splits, hr:r.t ? Math.round(r.hrSum/r.t) : 0, cad:170, elev:Math.round(km*2), kcal:km*72, pts:r.pts, xp:Math.round(km*20) + r.zones.length*25, zones:r.zones, ghostWin, ghostGap, newPRs};
  S.runs.unshift(run);
  if (r.pts){ S.pending += r.pts; S.ledger.unshift({s:'+', what:`جولة ${km.toFixed(2)} كم`, when:'الآن', amt:r.pts, pend:true}); }
  S.weeks[S.weeks.length-1] = +(weekKm() + km).toFixed(1);
  S.shoe.km = Math.round(S.shoe.km + km);
  S.profile.xp = Math.min(S.profile.xp + run.xp, S.profile.xpMax - 1);
  BASE_MAP = null;
  S.run = null; S.runMore = false; S.screen = 'summary'; render();
}

function qrSVG(seed){
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;

 doSub:() => { S.sub = true; S.modal = null; render(); toast('صرت مشتركاً', 'نقاطك ×2'); },
 sync:() => { S.modal = {title:'اربط ساعتك', body:syncBody(), actions:[{label:'تم',act:'closeModal',cls:'sun'}]}; render(); },
 toggleSync:d => { S.synced[d.k] = !S.synced[d.k]; S.modal.body = syncBody(); render(); },
 priv:d => { S.privacy[d.k] = !S.privacy[d.k]; render(); },
 orderMedal:() => { S.modal = {title:'طلب الميدالية', body:`<div class="sub num" style="font-weight:700">1,200 نقطة + التوصيل</div><div class="field"><label class="lab" for="addr">العنوان</label><input id="addr" placeholder="الحي، الشارع"></div>`, actions:[{label:'إلغاء',act:'closeModal'},{label:'أكّد',act:'doMedal',cls:'sun'}]}; render(); },
 doMedal:() => { S.modal = null; if (S.balance < 1200){ render(); toast('الرصيد ما يكفي',''); return; } S.balance -= 1200; S.medalOrdered = true; S.ledger.unshift({s:'−',what:'ميدالية سيد الكورنيش',when:'الآن',amt:1200}); render(); toast('سجلنا طلبك',''); },
 closeModal:() => { const r = S.run; S.modal = null; if (r) r.paused = false; render(); },
 wtab:d => { S.walletTab = d.k; render(); }, atab:d => { S.achTab = d.k; render(); }, ctab:d => { S.chatTab = d.k; render(); }, ltab:d => { S.logTab = d.k; render(); },
 thread:d => { const t = findChat(d.id); if (t.status === 'new') t.status = 'received'; S.thread = d.id; S.screen = 'chat'; render(); },
 unthread:() => { S.thread = null; render(); },
 addFriend:() => { const i = document.getElementById('chatq'); S.chatTab = 'friends'; render(); const j = document.getElementById('chatq'); if (j) j.focus(); toast('ابحث بالاسم الحركي', ''); },
 doAdd:d => { S.suggest = S.suggest.filter(n => n !== d.n); toast('أُرسل طلب الصداقة', d.n); S.chatQ = ''; render(); },
 quick:d => sendMsg(d.q),
 invite:d => { const p = PLAYERS.find(x => x.id === d.id); S.sel = null; render(); toast('طلبت الانضمام', p.name); },
 duel:d => { const p = PLAYERS.find(x => x.id === d.id); S.modal = {title:'تحدٍّ ضد ' + p.name, actions:[1,3,5].map(k => ({label:k+' كم', act:'doDuel', cls:k===3?'coral':'', data:{k, p:p.id}}))}; render(); },
 doDuel:d => { const p = PLAYERS.find(x => x.id === d.p); S.modal = null; S.sel = null; S.label = `${d.k} كم ضد ${p.name}`; S.goal = String(d.k); S.screen = 'prerun'; render(); toast('أُرسل التحدي', ''); },
 toast:d => toast(d.t, d.s),
 set:d => { S.profile[d.k] = d.v; render(); },
 gender:d => { const p = S.profile; p.gender = d.v; if (d.v === 'f'){ p.hw = 'hijab'; p.hair = 'pony'; p.beard = 'none'; } else { p.hw = 'cap'; p.hair = 'short'; } render(); },
 edtab:d => { S.edTab = d.k; render(); },
 avRand:() => { const p = S.profile, pick = a => a[Math.floor(Math.random() * a.length)][0], f = p.gender === 'f';
   p.skin = pick(AV.skins); p.hairColor = pick(AV.hairColors); p.outfit = pick(AV.tops); p.bottom = pick(AV.bottoms); p.shoe = pick(AV.shoes);
   p.hair = pick(f ? AV.hairF : AV.hairM); p.hw = pick(f ? AV.hwF : AV.hwM); if (!f) p.beard = pick(AV.beard); else p.hijabColor = pick(AV.hijabs); render(); },
 setGoal:d => { S.profile.goal = +d.v; render(); }
};
function sendMsg(text){
  text = text.trim(); if (!text || !S.thread) return;
  const t = findChat(S.thread); t.msgs.push(['me', text]); t.status = 'sent'; t.when = 'الآن'; render();
  setTimeout(() => { if (S.thread !== t.id) { t.status = 'opened'; return; } t.status = 'opened'; render(); }, 900);
  setTimeout(() => { const reply = ['يلا! عند النافورة','قبلت التحدي','جاهز بعد 5 دقايق'][t.msgs.length % 3]; t.msgs.push([t.members ? 'برق_البلد' : 'them', reply]); t.status = S.thread === t.id ? 'received' : 'new'; t.when = 'الآن'; if (S.screen === 'chat') render(); }, 2000);
}
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el){ if (S.sel && e.target.closest('svg.map.pan') && !dragged){ S.sel = null; render(); } return; }
  if (el.closest('svg.map.pan') && dragged) return;
  if ((el.classList.contains('sheet-back') || el.classList.contains('modal-back')) && e.target.closest('[data-stop]')) return;
  const fn = A[el.dataset.act]; if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
let holdT = null, holdStart = 0;
root.addEventListener('pointerdown', e => {
  const b = e.target.closest('#holdfin'); if (!b || !S.run) return;
  e.preventDefault(); holdStart = performance.now(); b.classList.add('holding');
  if (navigator.vibrate) navigator.vibrate(10);
  holdT = setTimeout(() => { holdT = null; b.classList.remove('holding'); if (navigator.vibrate) navigator.vibrate([20, 40, 20]); finishRun(); }, reduced ? 600 : 1000);
});
const holdEnd = () => { if (!holdT) return; clearTimeout(holdT); holdT = null; const b = document.getElementById('holdfin'); if (b) b.classList.remove('holding'); A.holdHint(); };
window.addEventListener('pointerup', holdEnd); window.addEventListener('pointercancel', holdEnd);
root.addEventListener('click', e => { if (e.target.closest('#holdfin') && e.detail === 0 && S.run) A.finish(); });
root.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-act]')){ e.preventDefault(); A[e.target.dataset.act](e.target.dataset); }
  if (e.key === 'Escape'){ if (S.modal) A.closeModal(); else if (S.sheet) A.closeSheet(); }
});
root.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.bind; if (!k) return;
  if (k === 'shopq'){ S.shopq = e.target.value; document.getElementById('store-grid').innerHTML = storeCards(); return; }
  if (k === 'ntime'){ S.notif.time = e.target.value; return; }
  if (k === 'chatq'){ S.chatQ = e.target.value; document.getElementById('chatlist').innerHTML = chatList(); return; }
  S.profile[k] = e.target.value;
  if (k === 'code'){ const ok = CODE_RE.test(e.target.value), m = document.getElementById('code-msg'); m.textContent = ok ? '✓ متاح' : '3 إلى 16 حرفاً'; m.style.color = ok ? 'var(--good)' : 'var(--bad)'; }
});
root.addEventListener('change', e => {
  if (e.target.id !== 'photo' || !e.target.files[0]) return;
  const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'), z = 240, k = Math.max(z / img.width, z / img.height); c.width = c.height = z; c.getContext('2d').drawImage(img, (z - img.width * k) / 2, (z - img.height * k) / 2, img.width * k, img.height * k); S.profile.photo = c.toDataURL('image/jpeg', .85); render(); }; img.src = fr.result; }; fr.readAsDataURL(e.target.files[0]);
});
root.addEventListener('submit', e => { if (e.target.id === 'sendf'){ e.preventDefault(); sendMsg(document.getElementById('msg').value); } });
let sx = null;
root.addEventListener('touchstart', e => { if (S.screen === 'intro') sx = e.touches[0].clientX; }, {passive:true});
root.addEventListener('touchend', e => { if (S.screen !== 'intro' || sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50){ dx > 0 ? A.introNext() : A.introPrev(); } }, {passive:true});

let lastPh = null; setInterval(() => { const ph = curPhase(); if (lastPh && ph !== lastPh && S.screen !== 'run') render(); lastPh = ph; }, 30000);
const hash = (location.hash || '').slice(1);
if (['world','signup','shop','ach','chat','wallet','log','profile','appearance','widget','notif'].includes(hash)) S.screen = hash;
const qph = (location.search.match(/ph=(\w+)/) || [])[1]; if (qph && PHASES[qph]) S.previewPhase = qph;
render();
})();
</script>
